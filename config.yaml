# RAWR configuration
# Turn-based spoken interaction with a NAO/Pepper robot under operator review.
# API keys are read from environment variables (not stored here).

audio:
  sample_rate: 16000
  silence_threshold_ms: 700
  min_speech_duration_ms: 300
  input: "robot"        # "robot": listen through the robot (NAO/Pepper and Reachy Mini mics, Furhat ASR); "computer": the computer mic

asr:
  model_size: "base.en"
  device: "auto"

llm:
  provider_name: "Grok"
  base_url: "https://api.x.ai/v1"
  model: "grok-4.20-0309-non-reasoning"   # pinned snapshot; the "grok-4-fast" alias now resolves to reasoning model grok-4.3
  max_tokens: 256
  temperature: 0.9
  api_key_env: "GROK_API_KEY"
  stream: false

# Which robot speaks the released replies (antagonist_robot/robots/).
robot:
  backend: "nao"        # nao | furhat | reachy_mini | text (prints replies; no robot)
  expressions: false    # condition-specific non-verbal cues on Furhat / Reachy Mini (off: verbal-only manipulation)

nao:
  ip: "nao.local"      # mDNS name; resolved on every connection (the cable IP changes per session)
  port: 9600
  naoqi_port: 9559
  password: "nao"

furhat:                 # needs the Remote API skill running on the robot or virtual Furhat (port 54321)
  host: "localhost"
  voice: null           # e.g. "Matthew"; null keeps the robot's current voice
  tts_engine: "furhat"  # furhat = robot's own voices (lip-synced); kokoro/system = RAWR's audio (lip sync not generated on the virtual Furhat)
  tts_voice: null       # kokoro voice (e.g. "am_michael") when tts_engine is kokoro
  audio_host: null      # this computer's address as the robot sees it (null = auto)
  audio_port: 8095

reachy_mini:            # needs the Reachy Mini daemon (robot, or: reachy-mini-daemon --sim)
  host: "localhost"
  port: 8000            # the daemon's port; run the console on another one (server.port or --port)
  connection_mode: "auto"
  tts_engine: "system"  # system = SAPI (Windows) / espeak-ng (Linux); kokoro = neural voice (see robots/tts.py)
  tts_rate: 175         # words per minute
  tts_voice: null       # system: substring of an installed voice name; kokoro: e.g. "af_heart"
  animate: true         # with robot.expressions: continuous speech-driven head and antenna motion
  speech_log_dir: null  # e.g. data/robot_speech: archive each robot utterance as played (WAV + JSONL)

avct:
  default_polar_level: 2
  default_category: "D"
  default_subtype: 2

# Operator review gate: every generated response is held before the robot speaks it.
operator:
  review_mode: "timed"          # "timed": auto-send after hold_seconds unless blocked; "manual": every response needs Send
  hold_seconds: 3.0             # review window in timed mode
  block_auto_send_at: "Orange"  # responses rated Orange or Red always need an explicit Send (or Temper)
  model_can_end_session: false  # the model's [END] token only suggests ending; the operator decides

# Optional psychosocial monitor (DialogGuard's five dimensions, one LLM call per response).
monitor:
  enabled: false
  base_url: "https://api.x.ai/v1"
  model: "grok-4.20-0309-non-reasoning"   # pinned snapshot; the "grok-4-fast" alias now resolves to reasoning model grok-4.3
  api_key_env: "GROK_API_KEY"
  timeout_s: 20.0
  gate_auto_send: true   # timed auto-send waits for the scores; a score of 2 or a monitor failure blocks it

# Optional fidelity monitor: does the reply enact the requested antagonism, or is it softened?
fidelity:
  detector_enabled: false               # offline DistilBERT softening detector (advisory)
  detector_path: "models/fidelity_detector"   # train with tools/train_fidelity_detector.py
  detector_device: "auto"
  judge_enabled: false                  # LLM judge with the RAGE benchmark rubric (0-10)
  judge_base_url: "https://api.openai.com/v1"
  judge_model: "gpt-4o"
  judge_api_key_env: "OPENAI_API_KEY"
  judge_timeout_s: 20.0
  block_auto_send_below: 4              # judge fidelity below this blocks auto-send; null = advisory only

logging:
  db_path: "data/Antagonistic Robot.db"
  audio_dir: "data/audio"
  save_audio: true

server:
  host: "127.0.0.1"   # console only on this machine; use 0.0.0.0 only on a trusted network (no authentication)
  port: 8000
